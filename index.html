
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - Digital Innovation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #111c33;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        section {
            padding: 100px 8%;
            min-height: 70vh;
        }

        .hero {
            text-align: center;
            padding-top: 150px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero span {
            color: #38bdf8;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #cbd5e1;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #0369a1;
        }

        .about {
            background: #172554;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }

        .contact {
            text-align: center;
        }

        input, textarea {
            width: 100%;
            max-width: 500px;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111c33;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>
